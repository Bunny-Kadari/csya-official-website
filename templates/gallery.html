<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{album.title}} — CSYA</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header class="nav"><a class="brand" href="{{url_for('home')}}"><img src="{{url_for('static',filename='logo.jpeg')}}"><span>CSYA<small>MEMORY BOOK</small></span></a><a class="admin-link" href="{{url_for('home')}}">← Home</a></header><section class="gallery-page"><p class="eyebrow">{{album.year}} • {{album.category}}</p><h1>{{album.title}}</h1><p>{{album.description}}</p><div class="gallery-grid">{% for p in photos %}<figure><img src="{{media_url(p.file)}}"><figcaption>{{p.title}} {% if p.caption %}— {{p.caption}}{% endif %}</figcaption></figure>{% else %}<p>No photos in this album yet.</p>{% endfor %}</div></section></body></html>
