<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSYA Admin Login</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="login-page"><div class="login-card"><img src="{{url_for('static',filename='logo.jpeg')}}"><p class="eyebrow">SECURE ADMIN ACCESS</p><h1>Welcome Back</h1><p>Manage the complete CSYA digital legacy.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,m in messages %}<div class="alert">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label>Admin Name</label><input name="name" value="teamcsya" required><label>Password</label><div class="pass"><input id="pw" name="password" type="password" required><button type="button" onclick="pw.type=pw.type==='password'?'text':'password'">Show</button></div><button class="btn primary wide">Enter Dashboard →</button></form><a class="back" href="{{url_for('home')}}">← Back to website</a></div></body></html>
